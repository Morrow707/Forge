<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin:0; width:390px; height:844px; overflow:hidden;
      background:#0a0c11; color:#f5f5f5;
      font-family:"Inter", ui-sans-serif, system-ui, sans-serif; font-size:14px; }
    a { color:#c63b10; } a:hover { color:#e04d1c; }
    .dsp { font-family:"Barlow Condensed","Inter",sans-serif; text-transform:uppercase; letter-spacing:.01em; }
    .scr { height:844px; overflow:hidden; display:flex; flex-direction:column; }
    .pad { padding:0 16px; }
    .card { background:#22262f; border:1px solid #333a47; border-radius:9.6px; }
    .sunk { background:#171a21; border-radius:9.6px; }
    .mut { color:#9aa0ab; }
    .pri { color:#c63b10; }
    .chip { border-radius:999px; font-weight:700; font-size:13px; padding:8px 16px; min-height:44px;
      display:flex; align-items:center; justify-content:center; }
    .btn { min-height:48px; border-radius:9.6px; display:flex; align-items:center; justify-content:center;
      gap:8px; font-weight:700; font-size:15px; border:none; }
    .btnp { background:#c63b10; color:#fff; }
    .btno { background:transparent; color:#f5f5f5; border:1px solid #333a47; }
    .lbl { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9aa0ab; font-weight:600; }
  </style>
</helmet>
<div class="scr">
  <div class="pad" style="padding-top:56px;">
    <p class="lbl">Before you start</p>
    <h1 class="dsp" style="margin:4px 0 0;font-size:27px;font-weight:700;line-height:1.05;">Set up for<br>Tee Work — Inside</h1>
  </div>

  <div class="pad" style="flex:1;padding-top:18px;display:flex;flex-direction:column;gap:11px;">
    <div>
      <span class="lbl">Get these</span>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#21c45d" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
          <span style="font-weight:500;">Bat</span>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#21c45d" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
          <span style="font-weight:500;">Tee</span>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4a5263" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          <span style="font-weight:500;">20 balls</span>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4a5263" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          <span style="font-weight:500;">Net or cage</span>
        </div>
      </div>
    </div>

    <div class="card" style="padding:14px;">
      <span class="lbl">Tee height</span>
      <p style="margin:7px 0 0;line-height:1.5;">Belt buckle, and set it on the inside corner — roughly a bat's width in front of your front foot.</p>
      <div class="sunk" style="margin-top:11px;height:104px;display:flex;align-items:center;justify-content:center;">
        <span class="mut" style="font-size:12px;">Setup diagram</span>
      </div>
    </div>

    <div class="sunk" style="padding:13px;display:flex;gap:11px;align-items:flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c63b10" stroke-width="2" style="flex-shrink:0;margin-top:1px;"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      <p style="margin:0;font-size:13px;line-height:1.45;">Filming? Phone on the ground, square to your side, waist height. Not behind you.</p>
    </div>
  </div>

  <div class="pad" style="padding-bottom:24px;">
    <button class="btn btnp" style="width:100%;">I'm set up — start</button>
  </div>
</div>
</x-dc>
</body>
</html>
