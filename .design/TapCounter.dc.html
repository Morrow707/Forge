<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin:0; width:390px; height:844px; overflow:hidden;
      background:#0a0c11; color:#f5f5f5;
      font-family:"Inter", ui-sans-serif, system-ui, sans-serif; font-size:14px; }
    a { color:#c63b10; } a:hover { color:#e04d1c; }
    .dsp { font-family:"Barlow Condensed","Inter",sans-serif; text-transform:uppercase; letter-spacing:.01em; }
    .scr { height:844px; overflow:hidden; display:flex; flex-direction:column; }
    .pad { padding:0 16px; }
    .card { background:#22262f; border:1px solid #333a47; border-radius:9.6px; }
    .sunk { background:#171a21; border-radius:9.6px; }
    .mut { color:#9aa0ab; }
    .pri { color:#c63b10; }
    .chip { border-radius:999px; font-weight:700; font-size:13px; padding:8px 16px; min-height:44px;
      display:flex; align-items:center; justify-content:center; }
    .btn { min-height:48px; border-radius:9.6px; display:flex; align-items:center; justify-content:center;
      gap:8px; font-weight:700; font-size:15px; border:none; }
    .btnp { background:#c63b10; color:#fff; }
    .btno { background:transparent; color:#f5f5f5; border:1px solid #333a47; }
    .lbl { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9aa0ab; font-weight:600; }
  </style>
</helmet>
<div class="scr">
  <div class="pad" style="padding-top:56px;">
    <h1 class="dsp" style="margin:0;font-size:26px;font-weight:700;">Tee Work — Inside Pitch</h1>
    <p class="mut" style="margin:4px 0 0;font-size:12px;">Set 2 of 3 · drive the inside half</p>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;" class="pad">
    <div style="text-align:center;">
      <div class="dsp" style="font-size:88px;font-weight:700;line-height:1;">14<span class="mut" style="font-size:34px;">/20</span></div>
      <p class="lbl" style="margin-top:2px;">Solid contact</p>
    </div>

    <div style="display:flex;gap:12px;margin-top:28px;">
      <button class="btn" style="flex:1;height:96px;background:rgba(33,196,93,.14);color:#21c45d;border:1px solid rgba(33,196,93,.35);flex-direction:column;gap:4px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        <span style="font-size:13px;">Good</span>
      </button>
      <button class="btn" style="flex:1;height:96px;background:#2a2e37;color:#9aa0ab;border:1px solid #333a47;flex-direction:column;gap:4px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span style="font-size:13px;">Miss</span>
      </button>
    </div>

    <div style="display:flex;gap:5px;margin-top:20px;flex-wrap:wrap;justify-content:center;">
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#2a2e37;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#2a2e37;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#2a2e37;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#21c45d;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#2a2e37;"></span>
      <span style="width:22px;height:22px;border-radius:4px;background:#333a47;border:1px dashed #4a5263;"></span>
    </div>
    <p class="mut" style="text-align:center;font-size:12px;margin-top:10px;">Tap a square to change it</p>
  </div>

  <div class="pad" style="padding-bottom:24px;display:flex;gap:10px;">
    <button class="btn btno" style="flex:1;">Record swing</button>
    <button class="btn btnp" style="flex:1.4;">Finish set</button>
  </div>
</div>
</x-dc>
</body>
</html>
