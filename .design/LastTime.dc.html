<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin:0; width:390px; height:844px; overflow:hidden;
      background:#0a0c11; color:#f5f5f5;
      font-family:"Inter", ui-sans-serif, system-ui, sans-serif; font-size:14px; }
    a { color:#c63b10; } a:hover { color:#e04d1c; }
    .dsp { font-family:"Barlow Condensed","Inter",sans-serif; text-transform:uppercase; letter-spacing:.01em; }
    .scr { height:844px; overflow:hidden; display:flex; flex-direction:column; }
    .pad { padding:0 16px; }
    .card { background:#22262f; border:1px solid #333a47; border-radius:9.6px; }
    .sunk { background:#171a21; border-radius:9.6px; }
    .mut { color:#9aa0ab; }
    .pri { color:#c63b10; }
    .chip { border-radius:999px; font-weight:700; font-size:13px; padding:8px 16px; min-height:44px;
      display:flex; align-items:center; justify-content:center; }
    .btn { min-height:48px; border-radius:9.6px; display:flex; align-items:center; justify-content:center;
      gap:8px; font-weight:700; font-size:15px; border:none; }
    .btnp { background:#c63b10; color:#fff; }
    .btno { background:transparent; color:#f5f5f5; border:1px solid #333a47; }
    .lbl { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9aa0ab; font-weight:600; }
  </style>
</helmet>
<div class="scr">
  <div class="pad" style="padding-top:56px;">
    <h1 class="dsp" style="margin:0;font-size:26px;font-weight:700;">Tee Work — Inside</h1>
    <p class="mut" style="margin:4px 0 0;font-size:12px;">Fourth time on this drill</p>
  </div>

  <div class="pad" style="flex:1;padding-top:16px;display:flex;flex-direction:column;gap:12px;">
    <div class="card" style="padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span class="lbl">Solid contact, by session</span>
        <span style="font-size:12px;color:#21c45d;font-weight:600;">+25%</span>
      </div>
      <div style="display:flex;align-items:flex-end;gap:10px;height:92px;margin-top:12px;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:100%;height:44%;background:#2a2e37;border-radius:5px 5px 0 0;"></div>
          <span class="mut" style="font-size:10px;">Aug 18</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:100%;height:56%;background:#2a2e37;border-radius:5px 5px 0 0;"></div>
          <span class="mut" style="font-size:10px;">Aug 25</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:100%;height:66%;background:#2a2e37;border-radius:5px 5px 0 0;"></div>
          <span class="mut" style="font-size:10px;">Sep 1</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:100%;height:88%;background:#c63b10;border-radius:5px 5px 0 0;"></div>
          <span style="font-size:10px;color:#c63b10;font-weight:600;">Today</span>
        </div>
      </div>
    </div>

    <div class="sunk" style="padding:14px;">
      <span class="lbl">Last time</span>
      <p style="margin:7px 0 0;font-size:15px;">15 of 20 solid · best set was your third</p>
      <p class="mut" style="margin:6px 0 0;font-size:12px;line-height:1.45;">Coach Marcus: "Third set was the one. You stopped rushing."</p>
    </div>

    <div>
      <span class="lbl">Beat today</span>
      <div class="card" style="padding:16px;margin-top:7px;display:flex;align-items:center;justify-content:space-between;">
        <div><div class="dsp" style="font-size:32px;font-weight:700;">16</div><span class="mut" style="font-size:12px;">of 20 to set a new best</span></div>
        <div style="text-align:right;"><div class="dsp" style="font-size:32px;font-weight:700;color:#21c45d;">9</div><span class="mut" style="font-size:12px;">so far</span></div>
      </div>
    </div>
  </div>

  <div class="pad" style="padding-bottom:24px;display:flex;gap:10px;">
    <button class="btn btno" style="flex:1;">See the drill</button>
    <button class="btn btnp" style="flex:1.3;">Log a swing</button>
  </div>
</div>
</x-dc>
</body>
</html>
