name: CI

# Catches exactly the failure class that broke four Render deploys in a
# row on 2026-08-19/20: shared/schema.ts (the Drizzle type layer) drifting
# out of sync with server/reconcile-schema.ts (the actual migration script
# Render's build runs -- see that file's own comment for why drizzle-kit
# push isn't used instead). Runs the same build/reconcile/seed sequence
# Render's buildCommand does, against a throwaway Postgres, so a broken
# migration fails here in a couple of minutes instead of showing up as a
# failed production deploy.
on:
  push: {}
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge_ci
    steps:
      - uses: actions/checkout@v7
        with:
          # The live-document migration test replays every historical version of the legal
          # documents through LIVE_DOCUMENT_PATCHES, which needs their history. A shallow
          # clone has one commit and the test cannot run at all -- and a test that quietly
          # does nothing in CI is worse than no test, because it reads as passing.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # No DATABASE_URL needed for these -- server/billing.test.ts mocks
      # ./storage rather than importing the real thing, so this can run
      # before the Postgres-dependent steps below, not after.
      - name: Test
        run: npm test

      # The AI guardrail suite. Grading is pure string work against answers
      # recorded in the repo, so this costs nothing and needs no API key --
      # only `--live`, which regenerates them, calls the model.
      #
      # Passes trivially while no answers are recorded, and starts gating the
      # moment the first one is. That ratchet is the point: the alternative
      # was leaving it out of CI entirely, where it would have rotted.
      - name: AI guardrails
        run: npm run eval

      # Blocking, and deliberately scoped to what actually runs in
      # production. It is kept separate from the build-tooling audit below
      # even though both are now blocking at the same level: the two answer
      # different questions, and if the build tree ever has to be relaxed
      # again, that must not quietly relax the production bar along with it.
      #
      # moderate, not high: the two qs advisories this step exists to keep
      # fixed are both rated moderate, so a `high` bar would have sat there
      # green while the exact regression it was written for walked past it.
      # Checked by removing the override and confirming this step fails.
      #
      # Note package.json's overrides.qs: express 4 and body-parser both pin
      # qs to ~6.15.1, and the two live qs advisories (an array-limit bypass
      # and a DoS, both reachable by anyone who can send a URL) are only
      # fixed in 6.16.0 -- outside that range. So `npm audit fix` reported a
      # fix was available, upgraded to 6.15.3, and left the vulnerability in
      # place, every time. The override is what actually patches it without
      # an Express 5 migration.
      #
      # Both audit steps go through scripts/npm-audit-retry.sh: on 2026-09-19
      # npm's audit server answered five runs in a row with a 400 ("Invalid
      # package tree") on an unchanged lockfile, then passed the same commit
      # twenty minutes later. The script retries ONLY that case -- the
      # "audit endpoint returned an error" line -- and never a real advisory,
      # so a vulnerability still fails on the first try.
      - name: Audit production dependencies
        run: bash scripts/npm-audit-retry.sh --omit=dev --audit-level=moderate

      # The build tooling, and now blocking rather than a warning.
      #
      # It was a warning because the tree genuinely could not go green: a
      # critical in tar and highs in sharp and esbuild, all transitive, none
      # fixable at the time. A red CI nobody can act on is one people learn
      # to scroll past, which costs more than it catches.
      #
      # That is no longer true. @capacitor/assets was the source of most of
      # it and was removed (nothing invoked it -- see
      # docs/dependency-overrides.md), and the two that remained are pinned
      # by overrides. The whole tree reports zero, so this holds a bar that
      # is currently met -- the same rule the production audit above is set
      # by, and the only kind of bar worth making blocking.
      #
      # Same moderate level as production, not a laxer one, because the
      # blast radius here is arguably worse: this tree runs on a runner
      # holding the distribution certificate and the App Store Connect key.
      # A dev-only advisory is not automatically the lesser problem.
      #
      # If this goes red on something genuinely unfixable, prefer an
      # override with its reasoning in docs/dependency-overrides.md. Drop it
      # back to a warning only if that is impossible, and say why here --
      # going back quietly loses the ratchet.
      - name: Audit build tooling
        run: bash scripts/npm-audit-retry.sh --audit-level=moderate

      - name: Build (web + server)
        run: npm run build

      # Every column/table shared/schema.ts declares must exist in a real
      # database by the time this step ends -- if it doesn't, reconcile-
      # schema.ts wasn't updated to match, exactly like tonight's incident.
      - name: Reconcile schema against a fresh database
        run: npm run db:reconcile

      # Runs every query seed.ts makes against the real table shapes --
      # this is what actually caught the missing date_of_birth column,
      # since reconcile succeeding just means its own statements didn't
      # error, not that the schema is complete.
      - name: Seed demo data
        run: npm run db:seed

      # Re-running both confirms they're still idempotent (additive-only,
      # safe to re-run on every deploy) and that seeding never clobbers
      # data a real admin might have already edited -- see seed.ts's own
      # onConflictDoNothing/"only if not already configured" guards.
      - name: Reconcile + seed again (idempotency check)
        run: |
          npm run db:reconcile
          npm run db:seed

      # Does the database actually have the foreign keys shared/schema.ts
      # declares? reconcile-schema.ts is additive-only, and CREATE TABLE IF
      # NOT EXISTS is a no-op against a table that already exists, so every
      # REFERENCES ... ON DELETE CASCADE inside one of those blocks reaches
      # only databases where that table did not yet exist. Proven by dropping
      # a foreign key from a reconciled database and re-running the
      # migration: it exits zero, prints "complete", and leaves it missing.
      #
      # On a from-scratch CI database this passes trivially, since every
      # table was just created with its constraints. That is the point: it
      # pins the DECLARATION against what the migration actually builds, so
      # a future constraint added only inside a CREATE TABLE block -- which
      # would silently never reach production -- fails here instead.
      #
      # Pointing this at a copy of the production database is what would
      # answer the open question of which constraints are missing there.
      - name: Check for foreign-key drift
        run: npm run db:check-drift

      # The half of the suite that needs a real database (*.itest.ts). It
      # provisions its OWN database on this same server rather than using
      # forge_ci above -- these tests truncate every table between cases,
      # and pointing them at the database the steps above just seeded would
      # destroy what those steps proved.
      #
      # Runs last for the same reason, and covers what `npm test` above
      # structurally cannot: server/storage.ts is 21,000 lines of queries,
      # and mocking Drizzle well enough for an assertion to mean anything
      # would amount to asserting against the mock.
      - name: Integration tests (real Postgres)
        run: npm run test:integration

  # This is the actual fix for the gap that let the 2026-08-19/20 incident
  # (and this morning's repeat of it) reach production: build-and-migrate
  # above proved CI *catches* a bad schema/reconcile drift, but Render was
  # still deploying straight off the raw git push webhook regardless of
  # whether this workflow passed or failed -- a red CI run only ever told
  # someone about the problem after the fact, at the same moment as the
  # failed deploy, not before it.
  #
  # `needs: build-and-migrate` is what actually closes that gap: this job
  # (and the deploy it triggers) is skipped entirely if that job fails, no
  # separate condition required.
  #
  # For this to work, Auto-Deploy must be turned OFF in the Render
  # dashboard for the forge service (Settings -> Build & Deploy) so Render
  # stops deploying on every raw push -- otherwise a bad commit still
  # reaches production immediately, in parallel with this job, and this
  # gate is decorative. Then paste that service's Deploy Hook URL
  # (Settings -> Deploy Hook) into a repo secret named
  # RENDER_DEPLOY_HOOK_URL (Settings -> Secrets and variables -> Actions).
  # Until that secret exists, this job intentionally no-ops rather than
  # failing the whole workflow over infra that hasn't been wired up yet.
  deploy:
    needs: build-and-migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            # A GitHub Actions warning annotation, not a plain echo. This
            # used to print a line into a step nobody opens and exit 0, so
            # the run went green and looked exactly like a successful
            # deploy -- which is the worst possible presentation of "the
            # gate this job exists to be is not connected". A warning shows
            # on the run summary without failing the build, since whether
            # to wire this up is a decision, not a bug.
            echo "::warning title=Deploy gate not connected::RENDER_DEPLOY_HOOK_URL is not set, so this job deployed NOTHING. If Render Auto-Deploy is still on, every push is going straight to production without waiting for this workflow, and a red CI run does not stop it. See this job's comment in ci.yml for the two setup steps."
            echo "RENDER_DEPLOY_HOOK_URL isn't set -- deployed nothing. See the warning on this run's summary."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered."
