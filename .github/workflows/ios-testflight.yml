name: iOS TestFlight

# Manual on purpose, not on every push to main -- Render already
# auto-deploys the web app on every main push (see render.yaml); an App
# Store binary is a much heavier, slower, rate-limited artifact (Apple
# throttles TestFlight uploads) that should go out deliberately, not on
# every commit. Trigger from the Actions tab, or `gh workflow run` /
# GitHub's REST API from anywhere -- none of that requires a Mac.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    # macOS is the only runner image with Xcode -- this is the one piece of
    # the whole pipeline that has to run on Apple's own OS, which is
    # exactly why this job lives in CI instead of needing a local Mac.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check required secrets are configured
        run: |
          set -euo pipefail
          missing=()
          for name in IOS_DIST_CERTIFICATE_BASE64 IOS_DIST_CERTIFICATE_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME \
                      APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
                      APP_STORE_CONNECT_API_KEY_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "These come from Apple Developer Program enrollment (Phase 2) -- see the repo's app-store launch notes for how to generate each one."
            exit 1
          fi
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      # Capacitor 7+ integrates plugins via Swift Package Manager
      # (ios/App/CapApp-SPM), not CocoaPods -- there's no Podfile in this
      # project by design, and xcodebuild resolves SPM dependencies on its
      # own. Pre-resolving here just moves that network-dependent step
      # earlier and out of build_app's own timeout, and fails the job
      # clearly if package resolution itself is the problem rather than
      # letting a resolution failure look like a build failure.
      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Decode signing assets
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_DIST_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/dist_certificate.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/app_store_connect_key.p8"

      - name: Build and upload to TestFlight
        working-directory: ios
        run: bundle exec fastlane beta
        env:
          IOS_DIST_CERTIFICATE_PATH: ${{ runner.temp }}/dist_certificate.p12
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/app_store_connect_key.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}

      - name: Clean up signing assets
        if: always()
        run: rm -f "$RUNNER_TEMP"/dist_certificate.p12 "$RUNNER_TEMP"/profile.mobileprovision "$RUNNER_TEMP"/app_store_connect_key.p8
