name: Fetch Tracking Report

# On-demand relay for reading GET /api/admin/tracking-report -- this session's own sandbox has
# no outbound network access to the deployed server (org egress policy), but GitHub Actions
# runners do. Logs in as the dedicated claude-report-bot@forge.app admin account (see
# reconcile-schema.ts's own comment on that account) and prints the report to this job's log,
# which is readable the same way any other CI run's logs already are.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent tracked sets to include"
        required: false
        default: "20"

jobs:
  fetch-report:
    runs-on: ubuntu-latest
    env:
      REPORT_BOT_PASSWORD: ${{ secrets.REPORT_BOT_PASSWORD }}
    steps:
      - name: Log in and fetch the report
        run: |
          set -euo pipefail
          BASE_URL="https://forge-ebhd.onrender.com"
          COOKIE_JAR="$(mktemp)"

          curl -sS -c "$COOKIE_JAR" -X POST "$BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(node -e 'console.log(JSON.stringify({email:"claude-report-bot@forge.app",password:process.env.REPORT_BOT_PASSWORD}))')" \
            -o /dev/null -w "login: HTTP %{http_code}\n"

          echo "---"
          curl -sS -b "$COOKIE_JAR" "$BASE_URL/api/admin/tracking-report?limit=${{ github.event.inputs.limit }}"
