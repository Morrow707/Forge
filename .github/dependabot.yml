version: 2
updates:
  # Root package.json -- this is the one that would have caught the
  # drizzle-orm SQL-injection advisory automatically instead of only on a
  # manual npm audit pass. Weekly rather than daily: enough to stay current
  # without a PR every single day for every point release.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Every Radix/shadcn UI primitive bumps together -- one PR to review
      # instead of a dozen near-identical ones.
      radix-ui:
        patterns:
          - "@radix-ui/*"
    ignore:
      # Five majors that cannot be taken yet, each blocked by a package that
      # depends on the current version. Closing the PRs is not enough: the
      # next release reopens each one, and every reopen costs a notification
      # plus a CI run on a macOS-runner-constrained account. On 2026-09-07
      # five of these were open simultaneously and their check runs were
      # consuming the concurrency allowance while a TestFlight upload sat
      # queued for 23 minutes.
      #
      # Scoped to majors only -- minor and patch updates to all five keep
      # flowing, and a security advisory still opens a PR regardless of an
      # ignore rule. REMOVE an entry once its blocker below is resolved.
      #
      # tailwindcss 4: tailwindcss-animate has no Tailwind 4 release.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # zod 4: drizzle-zod pins zod 3.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # express 5: express-async-errors and express-rate-limit both expect 4.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      # react-dom 19: paired with @types/react-dom, and the rest of the tree
      # (including react itself) is still on 18.
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @dnd-kit/sortable 10 needs @dnd-kit/core 10, which the program
      # builder's drag-and-drop has not been ported to.
      - dependency-name: "@dnd-kit/sortable"
        update-types: ["version-update:semver-major"]
      # vite 8 and @vitejs/plugin-react 6 block each other, and neither can
      # move alone -- which is why each one's PR fails npm ci and takes the
      # CodeQL run down with it, twice per release. plugin-react 6 peers on
      # vite ^8; plugin-react 4 (what we have) peers on vite <=7. Proven
      # rather than assumed: vite 8 was merged to main on 2026-09-07, broke
      # the iOS build at npm ci, and was reverted in e3d7d11.
      #
      # Taking the pair together is a real project, not a version bump:
      # plugin-react 6 is the Rolldown rewrite and pulls in three new peer
      # dependencies of its own (oxc-transform-react, @rolldown/plugin-babel,
      # babel-plugin-react-compiler), all of which land in the bundle that
      # gets compiled into the app binary. REMOVE BOTH ENTRIES TOGETHER when
      # someone takes that on; removing one alone just recreates the loop.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # ios-testflight.yml/android-release.yml/ci.yml themselves -- an action
  # pinned to an old major version is a real supply-chain surface too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # android/ native dependencies (Capacitor's Android shell + plugins).
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    ignore:
      # Gradle 9 cannot build this app, and the blocker is not in our build
      # files. Proven rather than assumed: PR #85 bumped the wrapper to 9.7.1
      # on a throwaway branch, and the Android Build workflow failed in 31
      # seconds during configuration --
      #
      #   Plugin 'com.android.internal.library' relies on
      #   'org.gradle.api.problems.internal.InternalProblems', a Gradle
      #   internal API that was removed in Gradle 9.6.0.
      #
      # That is the documented Android Gradle Plugin 8.x / Gradle 9.6+
      # incompatibility. The same code at 8.14.3 passed on the same runner,
      # so the toolchain is healthy and only the wrapper version is at fault.
      #
      # Without this, every new 9.x release reopens a pull request that fails
      # for exactly this reason, and each one costs a notification and a CI
      # run to re-establish something already known.
      #
      # Scoped to majors on the wrapper alone: minor and patch updates to it,
      # and every other Gradle dependency in android/, keep flowing normally.
      # REMOVE THIS once AGP ships a release supporting Gradle 9.6+ -- at that
      # point the bump is wanted, and nothing else here has to change.
      #
      # The name is "gradle-wrapper", not "gradle". Confirmed against PR #85
      # itself rather than guessed: its branch is
      # dependabot/gradle/android/gradle-wrapper-9.7.1 and its compatibility
      # badge reads dependency-name=gradle-wrapper&package-manager=gradle.
      # A wrong name here would not error -- it would match nothing and this
      # whole block would quietly do nothing at all.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
