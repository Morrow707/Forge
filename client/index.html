<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies a saved light-mode choice before the first paint -- dark is
         the default and needs no class at all (see index.css's :root vs
         :root.light), so this only ever has to ADD the class, never flip a
         separate default one off. Keep this in sync with applyTheme in
         src/lib/theme.ts -- same class, same localStorage key, just here
         too so a light-mode user's very first paint is already correct
         instead of flashing dark before React mounts and fixes it. -->
    <script>
      try {
        if (localStorage.getItem("forge:theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- THE FALLBACK HEAD, not the per-page one.
         usePageMeta (src/lib/page-meta.ts) rewrites all of this per route, and
         scripts/prerender.ts (via shared/prerender-head.ts) bakes the result into a static file per public route,
         appends that route's JSON-LD, and writes app-shell.html -- the same head plus noindex -- for
         every path that is not a public page, so a crawler
         that does not run JavaScript still gets the right title and share card. What is here is
         what a route without its own metadata gets, and what a scraper sees for a path the
         prerenderer does not cover.

         "Forge" alone is a common noun and a dozen other products, so the brand term carried
         everywhere is the full one. -->
    <title>Forge Performance Systems — Coach. Program. Perform.</title>
    <meta name="description" content="Coaching software for strength and conditioning: build exercise libraries, program training blocks, and keep a whole roster's calendar in one place." />
    <link rel="canonical" href="https://forgeperformancesystems.com/" />

    <!-- A link to Forge is shared by one coach sending it to another far more often than it is
         found in a search result. Without these it arrives in Messages, Slack or anywhere else
         as a bare URL with no title and no picture. summary_large_image rather than summary:
         the small card crops to a square, which makes a screenshot of a dashboard unreadable. -->
    <meta property="og:site_name" content="Forge Performance Systems" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Performance Systems — Coach. Program. Perform." />
    <meta property="og:description" content="Coaching software for strength and conditioning: build exercise libraries, program training blocks, and keep a whole roster's calendar in one place." />
    <meta property="og:url" content="https://forgeperformancesystems.com/" />
    <meta property="og:image" content="https://forgeperformancesystems.com/marketing/shot-dashboard.png" />
    <!-- PNG, not the webp sibling the page itself loads: the scrapers that draw share cards do
         not decode webp. Width and height let the card render before the image is fetched;
         the prerenderer reads the real dimensions from the file. -->
    <meta property="og:image:width" content="3200" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Forge coach dashboard" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forge Performance Systems — Coach. Program. Perform." />
    <meta name="twitter:description" content="Coaching software for strength and conditioning: build exercise libraries, program training blocks, and keep a whole roster's calendar in one place." />
    <meta name="twitter:image" content="https://forgeperformancesystems.com/marketing/shot-dashboard.png" />
    <meta name="twitter:image:alt" content="Forge coach dashboard" />

    <meta name="theme-color" content="#F65B23" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
