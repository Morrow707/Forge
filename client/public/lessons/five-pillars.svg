<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="1">THE FIVE PILLARS OF ATHLETIC HITTING</text>

  <!-- connecting arrow line -->
  <line x1="95" y1="140" x2="805" y2="140" stroke="#94a3b8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Pillar 1: SEE IT -->
  <g>
    <circle cx="95" cy="140" r="52" fill="#f0fdfa" stroke="#14b8a6" stroke-width="4"/>
    <text x="95" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">SEE</text>
    <text x="95" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">IT</text>
    <text x="95" y="215" text-anchor="middle" font-size="12" fill="#334155">Track the pitch</text>
    <text x="95" y="230" text-anchor="middle" font-size="12" fill="#334155">early &amp; clearly</text>
  </g>

  <!-- Pillar 2: DECIDE -->
  <g>
    <circle cx="272" cy="140" r="52" fill="#f0fdfa" stroke="#14b8a6" stroke-width="4"/>
    <text x="272" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">DECIDE</text>
    <text x="272" y="215" text-anchor="middle" font-size="12" fill="#334155">Choose whether</text>
    <text x="272" y="230" text-anchor="middle" font-size="12" fill="#334155">&amp; where to swing</text>
  </g>

  <!-- Pillar 3: MOVE -->
  <g>
    <circle cx="450" cy="140" r="52" fill="#f0fdfa" stroke="#14b8a6" stroke-width="4"/>
    <text x="450" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">MOVE</text>
    <text x="450" y="215" text-anchor="middle" font-size="12" fill="#334155">Athletic, efficient</text>
    <text x="450" y="230" text-anchor="middle" font-size="12" fill="#334155">speed &amp; power</text>
  </g>

  <!-- Pillar 4: ADJUST -->
  <g>
    <circle cx="628" cy="140" r="52" fill="#f0fdfa" stroke="#14b8a6" stroke-width="4"/>
    <text x="628" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">ADJUST</text>
    <text x="628" y="215" text-anchor="middle" font-size="12" fill="#334155">Respond to what</text>
    <text x="628" y="230" text-anchor="middle" font-size="12" fill="#334155">the pitch actually does</text>
  </g>

  <!-- Pillar 5: COMPETE -->
  <g>
    <circle cx="805" cy="140" r="52" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
    <text x="805" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">COMPETE</text>
    <text x="805" y="215" text-anchor="middle" font-size="12" fill="#334155">Use it in a</text>
    <text x="805" y="230" text-anchor="middle" font-size="12" fill="#334155">real at-bat</text>
  </g>
</svg>
