<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="1">PITCH PLANE &amp; BAT PATH</text>

  <!-- ground -->
  <line x1="60" y1="330" x2="640" y2="330" stroke="#cbd5e1" stroke-width="3"/>

  <!-- pitch plane, coming down and in -->
  <line x1="600" y1="80" x2="330" y2="220" stroke="#f97316" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="560" y="70" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">Pitch plane</text>
  <text x="560" y="87" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">(downward angle)</text>

  <!-- bat path, matching plane through the contact zone -->
  <path d="M 150 300 Q 240 250 330 220 Q 380 205 430 190" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <text x="170" y="320" font-size="13" fill="#0f766e" font-weight="600">Bat path</text>

  <!-- contact point -->
  <circle cx="330" cy="220" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="330" y="245" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">Contact</text>

  <!-- attack angle arc -->
  <path d="M 290 235 A 45 45 0 0 1 330 195" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="255" y="205" font-size="12" fill="#334155">Attack</text>
  <text x="255" y="220" font-size="12" fill="#334155">angle</text>

  <text x="350" y="365" text-anchor="middle" font-size="12" fill="#64748b">Good hitting angles are a byproduct of matching the bat path to the pitch plane -- not a manufactured launch angle.</text>
</svg>
