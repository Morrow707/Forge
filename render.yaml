services:
  - type: web
    name: forge
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString

databases:
  - name: forge-db
    plan: free
