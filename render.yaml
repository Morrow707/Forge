services:
  - type: web
    name: forge
    env: node
    plan: starter
    # db:reconcile runs twice: the first pass creates/migrates tables (seed
    # needs those to exist), the second picks up any of reconcile's own
    # admin-dependent one-time seeds (e.g. the "Forge Standard Screen"
    # movement-screen battery in reconcile-schema.ts) that can only fire
    # once db:seed has created the admin account -- on a brand-new database
    # the admin doesn't exist yet on the first pass, so without this a
    # first-ever deploy would permanently skip that seed (there's no admin
    # account yet until *after* db:seed runs, and the one-time INSERT never
    # gets a second chance). Both scripts are idempotent/additive-only, so
    # re-running reconcile here is a safe no-op on every deploy after the
    # first.
    buildCommand: npm install --include=dev && npm run build && npm run db:reconcile && npm run db:seed && npm run db:reconcile
    startCommand: npm start
    healthCheckPath: /healthz
    # Coach/athlete-uploaded form-check and skill videos, plus coach-drawn
    # annotation PNGs, live on disk (see UPLOADS_ROOT in
    # server/uploaded-files.ts, and STORAGE_PATH below) -- without a
    # persistent disk, a web service's filesystem is wiped on every redeploy
    # and every restart, silently deleting every video anyone has ever
    # saved. Free-plan web services can't attach a disk at all, hence the
    # "starter" plan above -- if this ever needs to move off Render's own
    # disks (multi-instance scaling, wanting a CDN in front of video), swap
    # the uploads' multer disk storage for an S3-compatible object store
    # instead and drop this block.
    #
    # Mounted OUTSIDE the source tree (/var/data, not
    # /opt/render/project/src/...). Confirmed via a live diagnostic
    # (server's own GET /api/admin/storage-check route, added specifically
    # for this) on 2026-09-02/03: a video uploaded and confirmed viewable
    # was reported missing from disk minutes later, at the exact previous
    # in-tree mount path -- not a suspicion, a direct statfs-backed
    # existence check on the file that should have been there. Render's own
    # docs describe an in-tree mount path as supported, but the observed
    # behavior on this service didn't match, so this relocation is the
    # actual fix being tried, not a theoretical precaution.
    disk:
      name: forge-uploads
      mountPath: /var/data/forge-uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      # Where UPLOADS_ROOT (server/uploaded-files.ts) actually writes/reads
      # uploaded files -- must exactly match disk.mountPath above. Local dev
      # has neither this var nor a disk; UPLOADS_ROOT's own fallback covers
      # that case.
      - key: STORAGE_PATH
        value: /var/data/forge-uploads
      - key: SESSION_SECRET
        generateValue: true
      # Signs the short-lived /uploads access tokens (server/media-url-signing.ts)
      # -- its own key, separate from SESSION_SECRET, so rotating one for a
      # real reason (a leak, a scheduled rotation) never silently invalidates
      # the other. Falls back to SESSION_SECRET if this is ever unset, so
      # nothing breaks without it, but Render auto-generates a real, distinct
      # value on every deploy going forward.
      - key: MEDIA_URL_SECRET
        generateValue: true
      # Encrypts column values whose plaintext must not survive a database
      # leaving the database -- users.mfa_secret today, athlete identity next.
      #
      # sync: false, NOT generateValue, and the difference is the whole point.
      # generateValue mints a fresh value on every deploy, which is correct
      # for a signing secret (old signatures simply stop verifying) and
      # catastrophic for an encryption key: a new key does not invalidate the
      # old data, it makes it permanently unreadable. Set this once, by hand,
      # to `openssl rand -hex 32`, and keep an offline copy somewhere that is
      # not this platform. Losing it destroys what it protects.
      #
      # Its own key rather than reusing SESSION_SECRET, following the same
      # separation this file already keeps between the session, media and
      # native-token secrets: rotating one for a real reason must not take
      # the others with it -- and this is the one that can never be rotated
      # casually at all.
      - key: PII_ENCRYPTION_KEY
        sync: false
      # Master switch for every "no real billing yet" paywall stub in
      # server/routes.ts (testingUnlockAllPaywalls) -- Free Agent AI access
      # (strengthAi/skillsAi entitlements), Coaches Corner content, and Class
      # lesson purchases. "true" comps everyone so no new coach or Free Agent
      # signup hits a 402 during this pre-billing period; the underlying
      # paywall functions (hasAthletePaidForAiAccess, hasCoachesCornerAccess,
      # the lesson-purchase route) are untouched and start enforcing again
      # the moment this is set back to "false" or removed -- see
      # testingUnlockAllPaywalls's own comment for the exact routes it gates.
      - key: PAYWALLS_DISABLED
        value: "true"
      # NEW-DEVICE APPROVAL -- see server/trusted-devices.ts. A password alone
      # signs in only on a device the account has used before; any other
      # device waits on an email. Two ways to stand it down, both off by
      # default (absent here on purpose, so a blueprint sync cannot switch
      # either on):
      #   DEVICE_VERIFICATION_DISABLED="true" turns the gate off entirely --
      #   for an email-provider outage, when nobody could otherwise sign in
      #   on a new phone. Set it, fix the email, unset it.
      #   DEVICE_VERIFICATION_EXEMPT_EMAILS is a comma-separated list of
      #   accounts that sign in with a password alone: the App Review demo
      #   logins, which sign in on Apple's devices and cannot open the email.
      #   Nothing else belongs in it.
      - key: DEVICE_VERIFICATION_DISABLED
        sync: false
      - key: DEVICE_VERIFICATION_EXEMPT_EMAILS
        sync: false
      # THE TWO SWITCHES THAT DECIDE WHETHER ANYONE CAN BE CHARGED.
      # Both absent, both therefore off. Declared here as sync:false rather
      # than left undeclared so that "can Forge take money right now" is a
      # question the repo answers, instead of one you have to go and look in
      # a dashboard for.
      #
      # BILLING_LIVE is the card rail. Every Stripe entry point refuses
      # outright while it is off (chargingClosed in server/billing.ts), so a
      # STRIPE_SECRET_KEY can be configured and tested without opening a
      # till. Turning this on is the deliberate act that makes real cards
      # chargeable -- do not set it to run an experiment.
      #
      # APPLE_IAP_LIVE only decides whether the app SHOWS its StoreKit
      # purchase UI. It cannot make a purchase free or paid: that is decided
      # by where the build came from. A TestFlight build transacts against
      # Apple's sandbox and moves no real money; a build downloaded from the
      # public App Store charges for real. So this is safe to turn on while
      # distribution is TestFlight-only, and is a release-day decision after
      # that -- along with APPLE_IAP_ENVIRONMENT, which defaults to sandbox
      # and must become "production" in the same breath as a public release,
      # or real purchases will be charged by Apple and then refused by our
      # own verifier (see server/apple-iap.ts).
      - key: BILLING_LIVE
        sync: false
      # BILLING_ENFORCEMENT_ENABLED is the OTHER billing switch: whether a tier
      # actually restricts an account (roster cap, entitlements). Off through
      # beta, and isBetaAccount on each user must also be flipped per account
      # from the admin billing panel. See server/billing.ts ENFORCEMENT_ENABLED.
      - key: BILLING_ENFORCEMENT_ENABLED
        sync: false
      # Model overrides for server/ai.ts. Both have in-code defaults; set only to
      # pin a specific model id. LOG_RESPONSE_BODIES=true logs API response
      # bodies in server/index.ts -- debugging only, never on in production.
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_FAST_MODEL
        sync: false
      - key: LOG_RESPONSE_BODIES
        sync: false
      - key: APPLE_IAP_LIVE
        sync: false
      - key: APPLE_IAP_ENVIRONMENT
        sync: false
      # Required by Apple's verifier library the moment APPLE_IAP_ENVIRONMENT
      # is "production" -- it refuses to construct without it. The numeric
      # "Apple ID" on the app's App Store Connect General Information page.
      # Unset is correct while the environment is sandbox.
      - key: APPLE_APP_APPLE_ID
        sync: false
      # The Stripe side of the card rail BILLING_LIVE gates. Declared here,
      # sync:false, for the same reason as everything else in this block --
      # so the set of keys billing actually needs is answered by the repo,
      # not rediscovered from server/stripe-prices.ts one env var at a time.
      # Safe to set and test with Stripe TEST-mode keys (fake cards, no real
      # money) even with BILLING_LIVE on; swap in LIVE-mode keys only when
      # actually ready to charge real cards, without touching anything else
      # here.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Signs/verifies the webhook Stripe calls at /api/billing/webhook
      # (server/index.ts) -- comes from that specific webhook endpoint's
      # "Signing secret" in the Stripe Dashboard, not the API key.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # One Price id per Free Agent tier (shared/free-agent-tiers.ts) --
      # see freeAgentPriceEnvVar in server/stripe-prices.ts for how each name
      # is derived from the tier id.
      - key: STRIPE_PRICE_FREE_AGENT_BASIC
        sync: false
      - key: STRIPE_PRICE_FREE_AGENT_AI_COACH
        sync: false
      - key: STRIPE_PRICE_FREE_AGENT_AI_COACH_VIDEO
        sync: false
      # The coach org per-athlete rate (shared/billing-tiers.ts,
      # ORG_PER_ATHLETE_CENTS) -- one recurring Price, charged with
      # quantity = the roster band's ceiling. STRIPE_PRICE_COACH_BASE
      # (the flat account fee) is deliberately NOT declared here:
      # ORG_BASE_CENTS is 0 today, and stripe-prices.ts's own
      # missingPriceEnvVars only requires that var while there is a fee to
      # charge -- add it back the same way if that ever changes.
      - key: STRIPE_PRICE_COACH_PER_ATHLETE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      # Web Push VAPID keypair -- not auto-generatable like SESSION_SECRET
      # (needs to be a real EC keypair, not just a random string), so these
      # are set manually in the Render dashboard. Generate a pair with
      # `npx web-push generate-vapid-keys` and paste the values in; push
      # notifications silently no-op until both are set.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@forge.app
      # APNs (native iOS push) auth key -- native-app twin of the VAPID
      # keypair above, same "unset = silently no-ops" behavior. Generate in
      # Apple Developer Portal under Certificates, Identifiers & Profiles ->
      # Keys -> new key -> check "Apple Push Notifications service (APNs)".
      # APNS_KEY_ID is the 10-char Key ID shown after creation; APNS_TEAM_ID
      # is the Apple Developer Team ID (same one Fastlane already uses --
      # see APPLE_TEAM_ID in .github/workflows/ios-testflight.yml);
      # APNS_PRIVATE_KEY is the full contents of the downloaded AuthKey_*.p8
      # file, pasted as-is (PEM with real newlines is fine, Render's env var
      # editor preserves them). The App ID's Push Notifications capability
      # must also be enabled before any of this works -- see App.entitlements.
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.foreperformancesystems.forge
      # Resend API key for coach-driven progress report emails -- sign up at
      # resend.com (free tier), create an API key, and paste it in. Sending
      # silently no-ops until this is set. RESEND_FROM_EMAIL is sync: false
      # (not a checked-in `value:`) on purpose: a hardcoded blueprint default
      # here is exactly the kind of thing that could silently overwrite a
      # real, working from-address on some future blueprint sync -- it needs
      # a real domain verified in Resend first (see server/email.ts's own
      # sandbox-address warning), which is a manual, account-specific step
      # no blueprint default can stand in for.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Claude API key powering every AI feature (chat coach, AI program
      # builder, AI form-check, exercise substitution) -- get one at
      # https://console.anthropic.com/settings/keys. Every AI feature
      # silently no-ops with a friendly "AI isn't set up yet" message until
      # this is set; nothing else in the app is affected.
      - key: ANTHROPIC_API_KEY
        sync: false
      # USDA FoodData Central key for the food-log barcode/name lookup
      # fallback -- free at https://fdc.nal.usda.gov/api-key-signup. Open
      # Food Facts (no key needed) already covers most packaged-food
      # barcodes on its own; this just adds USDA's branded/generic data as
      # a second source. Barcode scanning and manual entry both work with
      # this unset.
      - key: USDA_FDC_API_KEY
        sync: false
      # Server-side error reporting (server/index.ts) -- create a Node/
      # Express project at sentry.io and paste its DSN here. Silently
      # no-ops (console.error only, same as today) until this is set.
      - key: SENTRY_DSN
        sync: false
      # Client-side error reporting (client/src/main.tsx) -- create a
      # React project at sentry.io (separate from the Node one above) and
      # paste its DSN here. Must be VITE_-prefixed for Vite to expose it
      # to browser code, and has to be set before the build step runs
      # (baked into the bundle, not read at runtime like the server one).
      - key: VITE_SENTRY_DSN
        sync: false

databases:
  - name: forge-db
    plan: basic-1gb
