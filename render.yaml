services:
  - type: web
    name: forge
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:reconcile && npm run db:seed
    startCommand: npm start
    healthCheckPath: /
    # Athlete-uploaded form-check videos and coach annotation PNGs are
    # written to server/uploads (see UPLOADS_DIR/ANNOTATIONS_DIR in
    # server/routes.ts). Without a persistent disk, that directory lives on
    # the instance's ephemeral filesystem and is wiped on every deploy and
    # restart -- every previously-saved video/annotation URL 404s the moment
    # the service redeploys, even though the DB row referencing it survives.
    # Mounting a disk here keeps those files across deploys and restarts.
    disk:
      name: forge-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      # Web Push VAPID keypair -- not auto-generatable like SESSION_SECRET
      # (needs to be a real EC keypair, not just a random string), so these
      # are set manually in the Render dashboard. Generate a pair with
      # `npx web-push generate-vapid-keys` and paste the values in; push
      # notifications silently no-op until both are set.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@forge.app
      # Resend API key for coach-driven progress report emails -- sign up at
      # resend.com (free tier), create an API key, and paste it in. Sending
      # silently no-ops until this is set. RESEND_FROM_EMAIL defaults to
      # Resend's shared sandbox address, which only delivers to your own
      # verified account email -- verify a domain in Resend and set
      # RESEND_FROM_EMAIL to send to athletes for real.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Forge <onboarding@resend.dev>"
      # Claude API key powering every AI feature (chat coach, AI program
      # builder, AI form-check, exercise substitution) -- get one at
      # https://console.anthropic.com/settings/keys. Every AI feature
      # silently no-ops with a friendly "AI isn't set up yet" message until
      # this is set; nothing else in the app is affected.
      - key: ANTHROPIC_API_KEY
        sync: false
      # USDA FoodData Central key for the food-log barcode/name lookup
      # fallback -- free at https://fdc.nal.usda.gov/api-key-signup. Open
      # Food Facts (no key needed) already covers most packaged-food
      # barcodes on its own; this just adds USDA's branded/generic data as
      # a second source. Barcode scanning and manual entry both work with
      # this unset.
      - key: USDA_FDC_API_KEY
        sync: false

databases:
  - name: forge-db
    plan: free
